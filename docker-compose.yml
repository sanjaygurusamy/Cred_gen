version: "3.8"

services:
  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: campuscarbon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campuscarbon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuscarbon_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-campuscarbon_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campuscarbon} -d ${POSTGRES_DB:-campuscarbon_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - campuscarbon_net

networks:
  campuscarbon_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
